name: Build WorkMoney APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, time-earnings-app]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides Android command-line tools.
      # Avoid setup-android@v3: it tries to install the retired SDK "tools" package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test wage math and compile APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WorkMoneyTimer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
